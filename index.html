<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria lotus</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <div class="galeria">

        <div class="columna">
            <img src="imagenes/loto_amarilla.jpg" alt="flor loto">
            <img src="imagenes/flor_lila.jpg" alt="flor loto">
            <img src="imagenes/loto_amarilla.jpg" alt="flor loto">
            <img src="imagenes/flor_lila.jpg" alt="flor loto">
            <img src="imagenes/loto_amarilla.jpg" alt="flor loto">
            
        </div>

        <div class="columna">
            <img src="imagenes/flor_lila.jpg" alt="flor loto">
            <img src="imagenes/loto_amarilla.jpg" alt="flor loto">
            <img src="imagenes/flor_lila.jpg" alt="flor loto">
            <img src="imagenes/loto_amarilla.jpg" alt="flor loto">
            <img src="imagenes/flor_lila.jpg" alt="flor loto">
        
        </div>

        <div class="columna">
            <img src="imagenes/loto_amarilla.jpg" alt="flor loto">
            <img src="imagenes/flor_lila.jpg" alt="flor loto">
            <img src="imagenes/loto_amarilla.jpg" alt="flor loto">
            <img src="imagenes/flor_lila.jpg" alt="flor loto">
            <img src="imagenes/loto_amarilla.jpg" alt="flor loto">
            
        </div>

        <div class="columna">
            <img src="imagenes/flor_lila.jpg" alt="flor loto">
            <img src="imagenes/loto_amarilla.jpg" alt="flor loto">
            <img src="imagenes/flor_lila.jpg" alt="flor loto">
            <img src="imagenes/loto_amarilla.jpg" alt="flor loto">
            <img src="imagenes/flor_lila.jpg" alt="flor loto">
            
        </div>

        <div class="columna">
            <img src="imagenes/loto_amarilla.jpg" alt="flor loto">
            <img src="imagenes/flor_lila.jpg" alt="flor loto">
            <img src="imagenes/loto_amarilla.jpg" alt="flor loto">
            <img src="imagenes/flor_lila.jpg" alt="flor loto">
            <img src="imagenes/loto_amarilla.jpg" alt="flor loto">
            
        </div>

    </div>

    <div id="modal"  class="modal">

    <span class="flecha izquierda">&#10094;</span>

    <img id="imgAmpliada" src="" alt="">

    <span class="flecha derecha">&#10095

    <script>
        const imagenes = document.querySelectorAll('.columna img');
        const modal = document.getElementById('modal');
        const imgAmpliada = document.getElementById('imgAmpliada');
        const flechaIzquierda = document.querySelector('.izquierda');
        const flechaDerecha = document.querySelector('.derecha');

        let indiceActual = 0;

        function mostrarImagen(indice) {
            imgAmpliada.src = imagenes[indice].src;
        }

        imagenes.forEach((imagen, indice) => {
            imagen.addEventListener('click', () => {
                indiceActual = indice;
                mostrarImagen(indiceActual);
                modal.style.display = 'flex';
            });
        });

        flechaDerecha.addEventListener('click', (e) => {
            e.stopPropagation();

            indiceActual++;

            if (indiceActual >= imagenes.length) {
                indiceActual = 0;
            }

            mostrarImagen(indiceActual);
        });

        flechaIzquierda.addEventListener('click', (e) => {
            e.stopPropagation();

            indiceActual--;

            if (indiceActual < 0) {
                indiceActual = imagenes.length - 1;
            }

            mostrarImagen(indiceActual);
        });

        modal.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        document.addEventListener('keydown', (e) => {

            if (modal.style.display !== 'flex') return;

            if (e.key === 'ArrowRight') {
                flechaDerecha.click();
            }

            if (e.key === 'ArrowLeft') {
                flechaIzquierda.click();
            }

            if (e.key === 'Escape') {
                modal.style.display = 'none';
            }

        });
    </script>


</div>
</body>
</html>
